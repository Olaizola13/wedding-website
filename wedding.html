<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/js/wedding-phase.js" charset="UTF-8"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jessica & Juanma's Wedding">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title data-key="page_title"></title>
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="J&J" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/weather.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;700&family=Playfair+Display:wght@700&family=Roboto&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

    <div class="language-switcher">
        <a href="?lang=en" title="English"><img src="/images/uk.png" alt="English"></a>
        <a href="?lang=es" title="Español"><img src="/images/spain.png" alt="Español"></a>
        <a href="?lang=de" title="Deutsch"><img src="/images/germany.png" alt="Deutsch"></a>
    </div>

    <button class="floating-help" type="button" aria-controls="faq" aria-expanded="false" data-key="floating_help" data-before-wedding></button>

    <main class="dashboard-container">
        
        <a href="/lovestory.html" class="story-button" title="Our Story">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </a>

        <header class="dashboard-header">
            <a href="/lovestory.html" class="header-illustration-link">
                <div class="header-image-container">
                    <img src="/images/header_illustration.webp" alt="Illustration of Jessica and Juanma" class="header-illustration">
                    <img src="/images/logo.webp" alt="Jessica & Juanma Wedding Logo" class="header-logo-overlay">
                </div>
            </a>
        </header>

        <!-- Countdown Timer -->
        <section id="countdown-timer" class="countdown-container" data-before-wedding>
            <div class="countdown-item">
                <span id="days" class="countdown-number">0</span>
                <span class="countdown-label" data-key="countdown_days"></span>
            </div>
            <div class="countdown-item">
                <span id="hours" class="countdown-number">0</span>
                <span class="countdown-label" data-key="countdown_hours"></span>
            </div>
            <div class="countdown-item">
                <span id="minutes" class="countdown-number">0</span>
                <span class="countdown-label" data-key="countdown_minutes"></span>
            </div>
            <div class="countdown-item">
                <span id="seconds" class="countdown-number">0</span>
                <span class="countdown-label" data-key="countdown_seconds"></span>
            </div>
        </section>

        <details class="weather-card" data-before-wedding>
            <summary class="weather-card-summary">
                <span class="weather-summary-icon" aria-hidden="true">☀️</span>
                <span class="weather-summary-copy">
                    <span class="weather-eyebrow" data-key="weather_location"></span>
                    <span class="weather-heading" data-key="weather_title"></span>
                    <span class="weather-summary-hint" data-key="weather_expand_hint"></span>
                </span>
                <span class="weather-chevron" aria-hidden="true"></span>
            </summary>
            <div class="weather-card-content">
                <p class="weather-intro" data-key="weather_intro"></p>
                <div class="weather-days" aria-live="polite" aria-busy="true">
                    <article class="weather-day" data-weather-date="2026-10-16">
                        <div class="weather-day-heading">
                            <div>
                                <p class="weather-day-name" data-key="weather_friday"></p>
                                <p class="weather-day-date" data-key="weather_friday_date"></p>
                            </div>
                            <span class="weather-condition-icon" aria-hidden="true">···</span>
                        </div>
                        <p class="weather-condition" data-weather-condition data-key="weather_loading"></p>
                        <div class="weather-metrics">
                            <p><span data-key="weather_temperature"></span><strong data-weather-temperature>—</strong></p>
                            <p><span data-key="weather_rain"></span><strong data-weather-rain>—</strong></p>
                        </div>
                    </article>
                    <article class="weather-day" data-weather-date="2026-10-17">
                        <div class="weather-day-heading">
                            <div>
                                <p class="weather-day-name" data-key="weather_saturday"></p>
                                <p class="weather-day-date" data-key="weather_saturday_date"></p>
                            </div>
                            <span class="weather-condition-icon" aria-hidden="true">···</span>
                        </div>
                        <p class="weather-condition" data-weather-condition data-key="weather_loading"></p>
                        <div class="weather-metrics">
                            <p><span data-key="weather_temperature"></span><strong data-weather-temperature>—</strong></p>
                            <p><span data-key="weather_rain"></span><strong data-weather-rain>—</strong></p>
                        </div>
                    </article>
                </div>
                <div class="weather-note">
                    <span aria-hidden="true">🧥</span>
                    <p data-key="weather_climate_note"></p>
                </div>
                <p class="weather-updated" data-weather-updated data-key="weather_waiting"></p>
                <p class="weather-source"><span data-key="weather_source"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
            </div>
        </details>

        <section class="post-wedding-card" data-after-wedding hidden aria-labelledby="post-wedding-title">
            <div class="post-wedding-heart" aria-hidden="true">♡</div>
            <h1 id="post-wedding-title" data-key="post_wedding_title"></h1>
            <p data-key="post_wedding_message"></p>
            <p class="post-wedding-signature" data-key="post_wedding_signature"></p>
            <p data-key="post_wedding_memories_prompt"></p>
            <a class="post-wedding-memories-link" href="/memories.html" data-key="post_wedding_memories_button"></a>
        </section>
        <div class="celebration-confetti" data-after-wedding hidden aria-hidden="true"></div>

        <section class="event-details-card" data-before-wedding>
            <div class="event-card-header">
                <h2 data-key="dear_guests"></h2>
                <p class="event-card-intro-truncated" data-key="wedding_intro_truncated"></p>
            </div>
            <div class="event-summary">
                <p data-key="main_friday_summary"></p>
                <p data-key="main_saturday_summary"></p>
            </div>
            <a class="event-bus-notice" href="/transport.html#shuttle" data-key="main_bus_notice"></a>
             <div class="collapsible-wrapper">
                <div class="collapsible-content" id="weekend-event-details" inert>
                    <p class="event-card-text" data-key="wedding_intro"></p>
                    <div class="visual-separator"></div>
                    <div class="event-item">
                        <h3 data-key="pre_wedding_title"></h3>
                        <p data-key="pre_wedding_date"></p>
                        <p data-key="pre_wedding_location"></p>
                        <p data-key="pre_wedding_schedule"></p>
                        <p data-key="pre_wedding_dresscode"></p>
                    </div>
                    <div class="visual-separator"></div>
                    <div class="event-item">
                        <h3 data-key="wedding_title"></h3>
                        <p data-key="wedding_date_long"></p>
                        <p data-key="wedding_location"></p>
                        <p data-key="wedding_dresscode"></p>
                    </div>
                    <div class="visual-separator"></div>
                    <p class="event-card-text" data-key="wedding_outro"></p>
                </div>
            </div>
            <button class="toggle-arrow-container" type="button" aria-controls="weekend-event-details" aria-expanded="false" aria-label="Show full weekend details">
                 <svg class="toggle-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>
            </button>
        </section>

        <section class="icon-button-grid icon-button-grid--three-columns">
            <a href="/travel.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_travel.webp" alt="" data-key="btn_travel">
                <span data-key="btn_travel"></span>
            </a>
            <a href="/accommodations.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_accommodations.webp" alt="" data-key="btn_accommodations">
                <span data-key="btn_accommodations"></span>
            </a>
            <a href="/locations.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_locations.webp" alt="" data-key="btn_locations">
                <span data-key="btn_locations"></span>
            </a>
            <a href="/transport.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_transport.webp" alt="" data-key="btn_transport">
                <span data-key="btn_transport"></span>
            </a>
            <a href="/kids.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_kids.webp" alt="" data-key="btn_kids">
                <span data-key="btn_kids"></span>
            </a>
            <a href="/recommendations.html" class="icon-button">
                <img src="/images/icon_recommendations.webp" alt="" data-key="btn_recommendations">
                <span data-key="btn_recommendations"></span>
            </a>
            <a href="/gifts.html" class="icon-button">
                <img src="/images/icon_gifts.webp" alt="" data-key="btn_gifts">
                <span data-key="btn_gifts"></span>
            </a>
            <a href="/memories.html" class="icon-button">
                <img src="/images/icon_memories.webp" alt="" data-key="btn_memories">
                <span data-key="btn_memories"></span>
            </a>
            <a href="/rsvp.html" class="icon-button" data-before-wedding>
                <img src="/images/icon_rsvp.webp" alt="" data-key="btn_rsvp">
                <span data-key="btn_rsvp"></span>
            </a>
        </section>

        <section class="faq-card" id="faq" hidden data-before-wedding>
            <h2 data-key="faq_title"></h2>
            <details class="faq-item">
                <summary data-key="faq_save_date_q"></summary>
                <p data-key="faq_save_date_a"></p>
                <div class="calendar-link-row">
                    <a class="mini-calendar-button" data-calendar-event="prewedding" href="#" data-key="calendar_add_prewedding"></a>
                    <a class="mini-calendar-button" data-calendar-event="wedding" href="#" data-key="calendar_add_wedding"></a>
                </div>
            </details>
            <details class="faq-item">
                <summary data-key="faq_travel_q"></summary>
                <p data-key="faq_travel_a"></p>
                <a class="faq-inline-link" href="/travel.html" data-key="faq_go_travel"></a>
            </details>
            <details class="faq-item">
                <summary data-key="faq_stay_q"></summary>
                <p data-key="faq_stay_a"></p>
                <a class="faq-inline-link" href="/accommodations.html" data-key="faq_go_stay"></a>
            </details>
            <details class="faq-item">
                <summary data-key="faq_transport_q"></summary>
                <p data-key="faq_transport_a"></p>
                <a class="faq-inline-link" href="/transport.html" data-key="faq_go_transport"></a>
            </details>
            <details class="faq-item">
                <summary data-key="faq_kids_q"></summary>
                <p data-key="faq_kids_a"></p>
                <a class="faq-inline-link" href="/kids.html" data-key="faq_go_kids"></a>
            </details>
            <details class="faq-item">
                <summary data-key="faq_rsvp_q"></summary>
                <p data-key="faq_rsvp_a"></p>
                <a class="faq-inline-link" href="/rsvp.html" data-key="faq_go_rsvp"></a>
            </details>
        </section>

    </main>
    
    <script src="/js/translations/common.js" charset="UTF-8"></script>
    <script src="/js/translations/wedding.js" charset="UTF-8"></script>
    <script src="/js/translations/weather.js" charset="UTF-8"></script>
    <script src="/js/main.js" charset="UTF-8"></script>
    <script src="/js/weather.js" charset="UTF-8"></script>
</body>
</html>
