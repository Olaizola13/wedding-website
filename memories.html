<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jessica & Juanma's Wedding">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title data-key="memories_page_title"></title>
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="J&J" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;700&family=Playfair+Display:wght@700&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <div class="language-switcher">
        <a href="?lang=en" title="English"><img src="/images/uk.png" alt="English"></a>
        <a href="?lang=es" title="Español"><img src="/images/spain.png" alt="Español"></a>
        <a href="?lang=de" title="Deutsch"><img src="/images/germany.png" alt="Deutsch"></a>
    </div>
    
    <nav class="subpage-nav">
        <a href="/wedding.html" data-key="nav_back_to_main"></a>
    </nav>

    <header class="subpage-header">
        <img src="/images/icon_memories.webp" alt="Memories Icon">
        <h1 data-key="memories_page_title"></h1>
    </header>
    
    <main class="container centered-content">
        <p class="intro-text" data-key="memories_intro"></p>

        <!-- Guest uploads use an unsigned preset; account secrets must never appear here. -->
        <section class="memories-upload-card" aria-labelledby="memories-upload-title" data-upload-panel data-cloud-name="ty23k8cn" data-upload-preset="boda-2026-guests">
            <span class="memories-eyebrow" data-key="memories_eyebrow"></span>
            <h2 id="memories-upload-title" data-key="memories_upload_title"></h2>
            <p data-key="memories_upload_description"></p>

            <button type="button" class="upload-button memories-primary-button" data-choose-photos>
                <span class="upload-camera" aria-hidden="true">↑</span>
                <span data-key="memories_upload_button"></span>
                <span class="upload-arrow" aria-hidden="true">→</span>
            </button>
            <input id="wedding-photo-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple data-photo-input>

            <p class="memories-note" data-key="memories_note"></p>
            <div class="upload-progress" data-upload-progress hidden>
                <div class="upload-progress-track" aria-hidden="true"><span data-upload-progress-bar></span></div>
                <p class="upload-status" data-upload-status aria-live="polite"></p>
                <button type="button" class="upload-button memories-primary-button" data-retry-photos data-key="memories_retry_button" hidden></button>
            </div>
        </section>

        <div class="memories-tip">
            <span aria-hidden="true">♡</span>
            <p data-key="memories_tip"></p>
        </div>

        <p class="memories-thanks" data-key="memories_thanks"></p>
        <div class="text-center mt-30"><a href="/wedding.html" class="calendar-button" data-key="nav_back_to_main"></a></div>
    </main>
    
    <script src="/js/translations/common.js" charset="UTF-8"></script>
    <script src="/js/translations/memories.js" charset="UTF-8"></script>
    <script src="/js/main.js" charset="UTF-8"></script>
    <script src="/js/memories-upload.js" charset="UTF-8"></script>
</body>
</html>
